<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1.4;
    color: #333;
    width: 100%;
    height: 100%;
    overflow-y: auto;
  }

  .container {
    padding: 15px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .header {
    background-color: white;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 10px;
    margin-bottom: 15px;
    display: grid;
    grid-template-columns: 100px 1fr 1fr 1fr 1fr;
    gap: 10px;
  }

  .header-status {
    display: flex;
    align-items: center;
    font-family: monospace;
    font-size: 11px;
    color: #4a5568;
  }

  .header-field {
    display: flex;
    flex-direction: column;
  }

  .header-field label {
    font-weight: bold;
    margin-bottom: 3px;
    color: #007C3D;
  }

  .header-field-input {
    border: 1px solid #ccc;
    border-radius: 3px;
    background: #edf2f7;
    padding: 6px 8px;
    font-family: monospace;
    font-size: 11px;
    color: #4a5568;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-field input:focus {
    outline: none;
    border: 1px solid #ccc;
    box-shadow: none;
  }

  .tabs {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
  }

  .tab-buttons {
    display: flex;
    background-color: #f0f0f0;
    border-radius: 4px 4px 0 0;
    overflow-x: auto;
  }

  .tab-button {
    padding: 8px 12px;
    border: none;
    background-color: transparent;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.3s ease;
  }

  .tab-button:hover {
    background-color: #e0e0e0;
  }

  .tab-button.active {
    background-color: white;
    border-bottom-color: #007C3D;
    color: #007C3D;
    font-weight: bold;
  }

  .tab-content {
    flex: 1;
    background-color: white;
    border: 1px solid #ddd;
    border-top: none;
    border-radius: 0 0 4px 4px;
    padding: 15px;
    overflow-y: auto;
  }

  .tab-panel {
    display: none;
    height: 100%;
  }

  .tab-panel.active {
    display: block;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
    color: #333;
  }

  .form-group input[type="text"],
  .form-group select {
    width: 100%;
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 11px;
  }

  .style-select {
    width: 100%;
    padding: 6px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 11px;
  }

  .form-group input[type="text"]:focus,
  .form-group select:focus {
    outline: none;
    border-color: #007C3D;
    box-shadow: 0 0 3px rgba(0, 124, 61, 0.3);
  }

  .checkbox-group {
    margin-top: 8px;
  }

  .checkbox-item {
    display: flex;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .checkbox-item input[type="checkbox"] {
    margin-right: 8px;
    margin-top: 2px;
    accent-color: #007C3D;
  }

  .checkbox-item label {
    font-weight: normal;
    margin-bottom: 0;
    line-height: 1.3;
    cursor: pointer;
  }

  .conditional-field {
    margin-left: 20px;
    margin-top: 10px;
    padding: 10px;
    background-color: #f8f8f8;
    border-left: 3px solid #007C3D;
    border-radius: 0 3px 3px 0;
  }

  .conditional-field.disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  .button-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid #ddd;
    background-color: white;
  }

  .btn {
    padding: 8px 16px;
    border: 1px solid #ccc;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    text-decoration: none;
    display: inline-block;
    transition: all 0.3s ease;
  }

  .btn-guidance {
    background-color: #f0f0f0;
    color: #333;
  }

  .btn-guidance:hover {
    background-color: #e0e0e0;
  }

  .btn-close {
    background-color: #f0f0f0;
    color: #333;
  }

  .btn-close:hover {
    background-color: #e0e0e0;
  }

  .btn-save {
    background-color: #007C3D;
    color: white;
    border-color: #007C3D;
  }

  .btn-save:hover {
    background-color: #006533;
    border-color: #006533;
  }

  .empty-tab {
    text-align: center;
    color: #666;
    font-style: italic;
    padding: 50px 20px;
  }

  .form-columns {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
  }

  .form-column {
    flex: 1;
    min-width: 300px;
  }

  .domain-title {
    color: #007C3D;
    margin-bottom: 20px;
    font-size: 14px;
  }

  .questions-grid {
    display: grid;
    grid-template-columns: 2fr 100px 2fr;
    gap: 10px;
    margin-bottom: 20px;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 12px;
    background-color: #fafafa;
  }

  .question-elem-titles {
    font-weight: bold;
    color: #007C3D;
    border-bottom: 1px solid #ddd;
    padding-bottom: 5px;
    font-size: 11px;
  }

  .question-elem-titles-centralized {
    font-weight: bold;
    color: #007C3D;
    border-bottom: 1px solid #ddd;
    padding-bottom: 5px;
    text-align: center;
    font-size: 11px;
  }

  .domain-question-text {
    padding: 6px 0;
    font-size: 12px;
  }

  .domain-question-select {
    width: 100%;
    padding: 4px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 12px;
    background: #F0F0F0;
  }

  .domain-question-textarea {
    width: 100%;
    padding: 4px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 12px;
    resize: none;
  }

  .domain-rob-jud-select-div {
    display: flex;
    gap: 8px;
  }

  .domain-rob-jud-select {
    width: 150px;
    padding: 4px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 12px;
    background: #F0F0F0;
  }

  .domain-rob-jud-textarea {
    flex: 1;
    height: 45px;
    padding: 4px;
    border: 1px solid #ccc;
    border-radius: 3px;
    font-size: 12px;
    resize: none;
    width: 497px;
  }

  .domain-rob-jud-title {
    color: #007C3D;
    margin-bottom: 10px;
    font-size: 12px;
  }

  .domain-rob-jud-div {
    margin-bottom: 8px;
  }

  .domain-rob-jud-alg-result-assessor-jud-div {
    display: flex;
    gap: 20px;
  }

  .domain-rob-jud-alg-result-div {
    flex: 0.66;
  }

  .domain-rob-jud-alg-result-assessor-jud-label {
    font-weight: bold;
    font-size: 12px;
    display: block;
    margin-bottom: 5px;
  }

  .domain-alg-result {
    background-color: #f0f0f0;
    padding: 6px 10px;
    border-radius: 3px;
    border: 1px solid #ccc;
    color: #666;
    font-family: monospace;
    font-size: 12px;
    height: 45px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .domain-rob-jud-vert-sep-alg-result-assessor-jud {
    width: 1px;
    background-color: #ddd;
    margin: 0 5px;
  }

  .domain-rob-jud-assessor-jud-div {
    flex: 2;
  }

  .domain-rob-bias-direction-div {
    margin-bottom: 8px;
  }

  .domain-rob-bias-direction-div-itens {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .domain-rob-bias-direction-label {
    font-weight: bold;
    font-size: 12px;
    min-width: 200px;
    padding-top: 4px;
    width: 259px;
  }

  .domain-rob-bias-direction-div-select {
    flex: 1;
    display: flex;
    gap: 8px;
  }

  dialog {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: none;
    border-radius: 8px;
    box-shadow: 0 0 2em rgba(0, 0, 0, 0.3);
    width: 90%;
    max-width: 600px;
    padding: 1.5rem;
  }

  dialog::backdrop {
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(2px);
  }

  .conteudo-modal {
    max-height: 60vh;
    overflow-y: auto;
    margin-bottom: 1rem;
  }

  .modal-actions {
    text-align: right;
  }

  .statement-multiple-questions {
    grid-column: 1 / -1;
    font-style: italic;
    font-size: 12px;
  }

  .sub-item {
    padding-left: 15px;
  }

  .overall-bias-div {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 29px;
    padding-bottom: 30px;
  }

  .column-overall-bias-div {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .overall-bias-domain-title-and-status {
    display: flex;
    align-items: center;
  }

  .overall-bias-domain-status {
    height: 35px;
    width: 35px;
    border-radius: 50%;
    margin-right: 12px;
    flex-shrink: 0;
    background-color: #F0F0F0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-weight: 500;
    font-family: monospace;
    font-size: 15px;
    border: 1px solid #CCC;
  }

  a.disabled {
    color: gray;
    text-decoration: none;
    pointer-events: none;
    cursor: default;
  }
</style>
