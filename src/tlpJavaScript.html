<script>
  const ittRobResults = [];
  const ppRobResults = [];

  function renderLegend() {
    const opt1LegendContainer = document.getElementById('opt1LegendJudgement');
    if (!opt1LegendContainer) return;
    
    opt1LegendContainer.innerHTML = '<div class="opt1-legend-title">Judgement:</div>';
    
    const items = [
      { t: "high", label: "High" },
      { t: "some", label: "Some concerns" },
      { t: "low", label: "Low" }
    ];
    
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'opt1-legend-item';
      div.innerHTML = `
        <div class="opt1-legend-circle-container">${createSVG(item.t, 20)}</div>
        <span>${item.label}</span>`;
      opt1LegendContainer.appendChild(div);
    });

    document.getElementById('opt2LegendLow').innerHTML = createSVG('low', 20) + '<span class="opt2-legend-text">Low risk</span>';
    document.getElementById('opt2LegendSome').innerHTML = createSVG('some', 20) + '<span class="opt2-legend-text">Some concerns</span>';
    document.getElementById('opt2LegendHigh').innerHTML = createSVG('high', 20) + '<span class="opt2-legend-text">High risk</span>';
  }

  function renderTable(robData) {
    const opt1TableBody = document.getElementById('opt1TableBody');
    const opt2TableBody = document.getElementById('opt2TableBody');

    if (!robData || robData.length === 0) {
      console.warn("No data found in the 'Summary' sheet.");
      return;
    }

    if (opt1TableBody) opt1TableBody.innerHTML = "";
    if (opt2TableBody) opt2TableBody.innerHTML = "";

    robData.forEach((study, index) => {
      const properties = ['d1', 'd2', 'd3', 'd4', 'd5', 'overall'];

      if (opt1TableBody) {
        const tr1 = document.createElement('tr');

        if (index === 0) {
          const tdSide = document.createElement('td');
          tdSide.rowSpan = robData.length;
          tdSide.className = 'opt1-side-label';
          tdSide.innerHTML = '<div>Study</div>';
          tr1.appendChild(tdSide);
        }

        const tdName1 = document.createElement('td');
        tdName1.className = 'opt1-study-name-cell opt1-table-header';
        tdName1.innerText = study.studyId || "";
        tr1.appendChild(tdName1);

        properties.forEach((p) => {
          const tdDom = document.createElement('td');
          tdDom.className = p !== 'overall' ? 'opt1-domain-cell' : 'opt1-domain-cell opt1-bg-overall';

          let d = study[p] ? study[p].toString().trim().toLowerCase() : "";
          let judgement = "";

          if (d === "low") judgement = "low";
          else if (d === "some concerns") judgement = "some";
          else if (d === "high") judgement = "high";

          if (judgement) {
            tdDom.innerHTML = createSVG(judgement, 35);
          }

          tr1.appendChild(tdDom);
        });

        opt1TableBody.appendChild(tr1);
      }

      if (opt2TableBody) {
        const tr2 = document.createElement('tr');

        const tdUniqueId = document.createElement('td');
        tdUniqueId.className = 'opt2-no-border'; 
        tdUniqueId.innerText = study.studyId || "";
        tr2.appendChild(tdUniqueId);

        const tdOutcome = document.createElement('td');
        tdOutcome.className = 'opt2-no-border';
        tdOutcome.innerText = study.outcome || "";
        tr2.appendChild(tdOutcome);

        properties.forEach((p) => {
          const tdDom = document.createElement('td');
        
          tdDom.className = 'opt2-border-cell'; 

          let d = study[p] ? study[p].toString().trim().toLowerCase() : "";
          let judgement = "";

          if (d === "low") judgement = "low";
          else if (d === "some concerns") judgement = "some";
          else if (d === "high") judgement = "high";

          if (judgement) {
            if (p !== 'overall') {
              tdDom.innerHTML = createSVG(judgement, 35, true);
            } else {
              tdDom.innerHTML = createSVG(judgement, 35);
            }
          }

          tr2.appendChild(tdDom);
        });

        opt2TableBody.appendChild(tr2);
      }
    });
  }

  function updateVisibleOption() {
    const figureTypeSelect = document.getElementById("figureTypeSelect");
    const option1 = document.getElementById("option1");
    const option2 = document.getElementById("option2");
  
    option1.classList.add("hidden");
    option2.classList.add("hidden");

    if (figureTypeSelect.value === "1") {
        option1.classList.remove("hidden");
    } else if (figureTypeSelect.value === "2") {
        option2.classList.remove("hidden");
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    showLoading('Loading...');

    document.getElementById("figureTypeSelect").addEventListener("change", updateVisibleOption);
    updateVisibleOption();

    renderLegend();
    google.script.run
      .withSuccessHandler(jsonRobResults => {
        
        if (jsonRobResults) {
          robResults = JSON.parse(jsonRobResults);
          
          robResults.forEach(element => {
            if (element.analysisType === 'itt'){
              ittRobResults.push(element);
            } else {
              ppRobResults.push(element);
            }
          });

          renderTable(ittRobResults);
        }

        hideLoading();
      })
      .withFailureHandler(function(error) {
        hideLoading();
        messageModal("Error loading data");
        console.error("Spreadsheet error: ", error);
      })
      .getRobResults();
  });

  function handleAnalysisChange() {
    const analysisSelectElement = document.getElementById('analysisSelect');
    const selectedAnalysis = analysisSelectElement.value;
    const titleElement = document.getElementById('figureTitle');
    const tableBody = document.getElementById('opt1TableBody');

    tableBody.innerHTML = "";
    
    if (selectedAnalysis === 'itt') {
      titleElement.innerText = "Intention-to-treat";
      renderTable(ittRobResults);
    } else if (selectedAnalysis === 'pp') {
      titleElement.innerText = "Per-protocol";
      renderTable(ppRobResults);
    }

  }

  const loadingDialog = document.getElementById('loading_dialog');
  function showLoading(message) {
    if (message) {
      loadingDialog.querySelector('p').innerText = message;
    } else {
      loadingDialog.querySelector('p').innerText = "";
    }

    if (loadingDialog && typeof loadingDialog.showModal === "function") {
      if (!loadingDialog.open) {
        loadingDialog.showModal();
      }
    }
  }
  function hideLoading() {
    if (loadingDialog && loadingDialog.open) {
      loadingDialog.close();
    }
  }

  const messageDialog = document.getElementById('messageDialog');
  function messageModal(message) {
    if (message) {
      messageDialog.querySelector('h2').innerText = message;
    } else {
      messageDialog.querySelector('h2').innerText = "";
    }

    if (messageDialog && typeof messageDialog.showModal === "function") {
      if (!messageDialog.open) {
        messageDialog.showModal();
        document.getElementById('dialog_message_close').onclick = () => {
          messageDialog.close();
        };
      }
    }
  }

  const COLORS = { low: "rgb(2, 193, 0)", some: "rgb(226, 223, 7)", high: "rgb(191, 0, 0)" };
  function createSVG(type, size, withoutStroke) {
    const color = COLORS[type];
    const canvasSizeSVG = size + 4; 
    const center = canvasSizeSVG / 2;
    const radius = (size / 2) - 0.5; 

    let metricSignal = '';
  
    if (type === 'low') {
      const thickness = size * 0.12; 
      const halfLength = size * 0.3;  
      metricSignal = `
        <line x1="${center - halfLength}" y1="${center}" x2="${center + halfLength}" y2="${center}" stroke="black" stroke-width="${thickness}" stroke-linecap="square"/>
        <line x1="${center}" y1="${center - halfLength}" x2="${center}" y2="${center + halfLength}" stroke="black" stroke-width="${thickness}" stroke-linecap="square"/>
      `;
    } 
    else if (type === 'high') {
      const thickness = size * 0.12;
      const halfLength = size * 0.28;
      metricSignal = `
        <line x1="${center - halfLength}" y1="${center}" x2="${center + halfLength}" y2="${center}" stroke="black" stroke-width="${thickness}" stroke-linecap="square"/>
      `;
    } 
    else if (type === 'some') {
      const thickness = size * 0.12;
      const topY = center - (size * 0.3);
      const baseBodyY = center + (size * 0.1);
      const dotY = center + (size * 0.3);
      metricSignal = `
        <line x1="${center}" y1="${topY}" x2="${center}" y2="${baseBodyY}" stroke="black" stroke-width="${thickness}" stroke-linecap="square"/>
        <circle cx="${center}" cy="${dotY}" r="${thickness / 2}" fill="black"/>
      `;
    }

    const strokeAttribute = withoutStroke ? '' : 'stroke="black" stroke-width="1.2"';

    return `
      <svg width="${canvasSizeSVG}" height="${canvasSizeSVG}" viewBox="0 0 ${canvasSizeSVG} ${canvasSizeSVG}" style="display: inline-block; vertical-align: middle; overflow: visible;">
        <circle cx="${center}" cy="${center}" r="${radius}" fill="${color}" ${strokeAttribute}/>
        ${metricSignal}
      </svg>`;
  }

  function generatePNG() {
    const area = document.getElementById('captureArea');
    const analysisSelectElement = document.getElementById('analysisSelect');
    const selectedAnalysis = analysisSelectElement.value;
    const styleSelectElement = document.getElementById('figureTypeSelect');
    const selectedStyle = styleSelectElement.value;

    area.classList.add('printing');
    void area.offsetHeight; // força reflow síncrono

    const targetSize = 3600;
    const currentWidth = area.getBoundingClientRect().width;
    const customScale = targetSize / currentWidth;

    html2canvas(area, {
      scale: customScale,
      backgroundColor: "#ffffff",
      useCORS: true,
      logging: false,
      width: area.scrollWidth,
      height: area.scrollHeight
    }).then(canvas => {
      area.classList.remove('printing');
      const link = document.createElement('a');
      link.download = 'traffic_light_plot_' + selectedAnalysis + "_t" + selectedStyle + "_" + '.png';
      link.href = canvas.toDataURL("image/png", 1.0);
      link.click();
    }).catch(err => {
      area.classList.remove('printing');
      console.error(err);
    });
  }
</script>
