<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    padding: 20px;
  }

  .controls {
    border: 1px solid #ddd;
    background: white;
    border-radius: 4px;
    margin-bottom: 20px;
    text-align: center;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px;
  }

  }

    padding: 8px 16px;
    border: 1px solid #ccc;
    border-radius: 3px;
    cursor: pointer;
    font-size: 15px;
    text-decoration: none;
    display: inline-block;
    transition: all 0.3s ease;
    background-color: #007C3D;
    color: white;
    border-color: #007C3D;

  .btn-download:hover {
    background-color: #006533;
    border-color: #006533;
  }

    position: fixed;
    top: 50%;
    left: 50%;
    translate: -50% -50%;

    border: none;
    outline: none;
    appearance: none;

    background: white;

    border-radius: 8px;
    box-shadow: 0 0 2em rgba(0,0,0,.3);

    width: 90%;
    max-width: 600px;
    padding: 1.5rem;

    backface-visibility: hidden;
  }

  dialog::backdrop {
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(2px);
  }

  .loading-dialog::backdrop {
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(2px);
  }

  }

    width: 40px;
    height: 40px;

    border-top: 4px solid #007C3D;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

    border: 1px solid #ccc;
    border-radius: 3px;
